<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08151d"><title>边境防线 · Frontier Defense</title>
  <meta name="description" content="原创科幻基地防守试玩：一名装甲步兵，两处入口，五波异星攻势。">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07151e;color:#ecf5f4;font-family:system-ui,-apple-system,sans-serif}
    #game{position:relative;width:100%;height:calc(100% - 44px);display:flex;align-items:center;justify-content:center;background:#020a10}
    canvas{width:100%;height:100%;display:block;outline:0;background:#07151e}#loading{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(ellipse at 60% 35%,#23404a,#07151e 65%);z-index:2;padding:28px;text-align:center}
    .tag{letter-spacing:.36em;color:#4fe6e4;font-size:12px}h1{font-size:clamp(40px,6vw,76px);font-weight:650;letter-spacing:.09em;margin:25px 0 10px}p{line-height:1.8;color:#9fb4be}#track{width:min(360px,75vw);height:3px;background:#263c45;margin:25px 0 16px}#bar{height:100%;width:0;background:#5ee5e8;transition:width .2s}#status{font-size:13px;color:#afc8d0}#error{display:none;color:#ffa9a1;max-width:700px;white-space:pre-wrap}
    footer{height:44px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#99b2bd;gap:12px}button{background:#173540;color:#d6eff2;border:1px solid #315662;border-radius:4px;padding:5px 13px;cursor:pointer}button:hover{background:#24505e}.hint{opacity:.8}@media(max-width:700px){.hint{display:none}footer{font-size:10px;padding:0 10px}}
  </style>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" tabindex="0" aria-label="边境防线 3D 基地防守游戏"></canvas>
    <div id="loading"><div class="tag">FRONTIER / 07</div><h1>边境防线</h1><p>守住基地，直到黎明。<br>三人小队 · 两处入口 · 五波攻势</p><div id="track"><div id="bar"></div></div><div id="status">正在连接前哨基地…</div><p style="font-size:12px">首次加载需要下载游戏文件，请稍候。<br>电脑浏览器试玩 · 建议使用键盘和鼠标</p><div id="error" role="alert"></div></div>
  </main>
  <footer><span>边境防线 v0.4 · 建造与科技</span><span class="hint">WASD 移动 · E 交互 · B 小队入堡 · F 跟随 · G 驻守 · Esc 暂停</span><button id="fullscreen">全屏试玩 ↗</button></footer>
  <script>
    const canvas=document.getElementById('unity-canvas'), status=document.getElementById('status');let instance;
    // Pointer lock can be declined after Escape, focus changes or a quick menu transition.
    // Handle only this request's rejection; Unity's lost-control check will pause the battle.
    const captureMouse=canvas.requestPointerLock?.bind(canvas);
    if(captureMouse)canvas.requestPointerLock=function(options){
      const declined=error=>console.warn('Mouse capture declined; click Continue in the pause menu.',error);
      try{const request=captureMouse(options);if(request&&typeof request.catch==='function')request.catch(declined);}
      catch(error){declined(error);}
    };
    function fail(message){document.getElementById('loading').style.display='flex';status.textContent='游戏暂时未能启动';const error=document.getElementById('error');error.style.display='block';error.textContent='请使用支持 WebGL 2 的桌面浏览器，并尝试刷新。\n'+message;}
    const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';
    script.onerror=()=>fail('下载中断，请检查网络连接。');
    script.onload=()=>createUnityInstance(canvas,{
      dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'Frontier Workshop',productName:'Frontier Defense',productVersion:'0.4.0',
      devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),
      showBanner:(message,type)=>{if(type==='error')fail(message);else console.warn(message)}
    },progress=>{document.getElementById('bar').style.width=(progress*100)+'%';status.textContent=progress<.9?'正在装载前哨基地… '+Math.round(progress*100)+'%':'正在启动装甲系统…';}).then(game=>{instance=game;document.getElementById('loading').style.display='none';canvas.focus();}).catch(error=>fail(String(error)));
    document.body.appendChild(script);document.getElementById('fullscreen').onclick=()=>{if(instance)instance.SetFullscreen(1)};
    canvas.addEventListener('contextmenu',event=>event.preventDefault());
  </script>
</body></html>
